<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Основные оси -->
  <line x1="60" y1="10" x2="60" y2="110" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2"/>
  <line x1="10" y1="60" x2="110" y2="60" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2"/>
  
  <!-- Зубчатая передача -->
  <circle cx="40" cy="60" r="25" fill="none" stroke="rgba(255, 255, 255, 0.8)" stroke-width="3"/>
  <circle cx="80" cy="60" r="25" fill="none" stroke="rgba(255, 255, 255, 0.8)" stroke-width="3"/>
  
  <!-- Зубья -->
  <g stroke="rgba(255, 255, 255, 0.9)" stroke-width="2" stroke-linecap="round">
    <!-- Левая шестерня -->
    <line x1="40" y1="35" x2="40" y2="30" transform="rotate(0,40,60)"/>
    <line x1="40" y1="35" x2="40" y2="30" transform="rotate(30,40,60)"/>
    <line x1="40" y1="35" x2="40" y2="30" transform="rotate(60,40,60)"/>
    <line x1="40" y1="35" x2="40" y2="30" transform="rotate(90,40,60)"/>
    <line x1="40" y1="35" x2="40" y2="30" transform="rotate(120,40,60)"/>
    <line x1="40" y1="35" x2="40" y2="30" transform="rotate(150,40,60)"/>
    <line x1="40" y1="35" x2="40" y2="30" transform="rotate(180,40,60)"/>
    <line x1="40" y1="35" x2="40" y2="30" transform="rotate(210,40,60)"/>
    <line x1="40" y1="35" x2="40" y2="30" transform="rotate(240,40,60)"/>
    <line x1="40" y1="35" x2="40" y2="30" transform="rotate(270,40,60)"/>
    <line x1="40" y1="35" x2="40" y2="30" transform="rotate(300,40,60)"/>
    <line x1="40" y1="35" x2="40" y2="30" transform="rotate(330,40,60)"/>
    
    <!-- Правая шестерня -->
    <line x1="80" y1="35" x2="80" y2="30" transform="rotate(0,80,60)"/>
    <line x1="80" y1="35" x2="80" y2="30" transform="rotate(30,80,60)"/>
    <line x1="80" y1="35" x2="80" y2="30" transform="rotate(60,80,60)"/>
    <line x1="80" y1="35" x2="80" y2="30" transform="rotate(90,80,60)"/>
    <line x1="80" y1="35" x2="80" y2="30" transform="rotate(120,80,60)"/>
    <line x1="80" y1="35" x2="80" y2="30" transform="rotate(150,80,60)"/>
    <line x1="80" y1="35" x2="80" y2="30" transform="rotate(180,80,60)"/>
    <line x1="80" y1="35" x2="80" y2="30" transform="rotate(210,80,60)"/>
    <line x1="80" y1="35" x2="80" y2="30" transform="rotate(240,80,60)"/>
    <line x1="80" y1="35" x2="80" y2="30" transform="rotate(270,80,60)"/>
    <line x1="80" y1="35" x2="80" y2="30" transform="rotate(300,80,60)"/>
    <line x1="80" y1="35" x2="80" y2="30" transform="rotate(330,80,60)"/>
  </g>
  
  <!-- Соединительная линия -->
  <line x1="65" y1="60" x2="55" y2="60" stroke="rgba(255, 255, 255, 0.5)" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Центры вращения -->
  <circle cx="40" cy="60" r="5" fill="rgba(255, 255, 255, 0.2)" stroke="rgba(255, 255, 255, 0.8)" stroke-width="2"/>
  <circle cx="80" cy="60" r="5" fill="rgba(255, 255, 255, 0.2)" stroke="rgba(255, 255, 255, 0.8)" stroke-width="2"/>
</svg>