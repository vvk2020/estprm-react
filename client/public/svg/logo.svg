<svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Символ системы управления -->
  <circle cx="30" cy="30" r="25" fill="none" stroke="rgba(255, 255, 255, 0.8)" stroke-width="2"/>
  
  <!-- Внутренние элементы управления -->
  <circle cx="30" cy="30" r="15" fill="none" stroke="rgba(255, 255, 255, 0.6)" stroke-width="1.5" stroke-dasharray="3 3"/>
  
  <!-- Сектора управления -->
  <path d="M30 15 A15 15 0 0 1 45 30" fill="none" stroke="rgba(255, 255, 255, 0.9)" stroke-width="2"/>
  <path d="M30 15 A15 15 0 0 0 15 30" fill="none" stroke="rgba(255, 255, 255, 0.7)" stroke-width="2"/>
  
  <!-- Центральный процессор -->
  <rect x="25" y="25" width="10" height="10" fill="none" stroke="rgba(255, 255, 255, 0.9)" stroke-width="2"/>
  
  <!-- Соединительные линии -->
  <line x1="30" y1="15" x2="30" y2="25" stroke="rgba(255, 255, 255, 0.5)" stroke-width="1.5"/>
  <line x1="15" y1="30" x2="25" y2="30" stroke="rgba(255, 255, 255, 0.5)" stroke-width="1.5"/>
  <line x1="45" y1="30" x2="35" y2="30" stroke="rgba(255, 255, 255, 0.5)" stroke-width="1.5"/>
  
  <!-- Символы данных -->
  <circle cx="20" cy="20" r="2" fill="rgba(255, 255, 255, 0.8)"/>
  <circle cx="40" cy="20" r="2" fill="rgba(255, 255, 255, 0.8)"/>
  <circle cx="20" cy="40" r="2" fill="rgba(255, 255, 255, 0.8)"/>
  <circle cx="40" cy="40" r="2" fill="rgba(255, 255, 255, 0.8)"/>
</svg>